<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News</title>
  <style>
    /* ============================================================
       NEWS APP STYLES – edit colors, fonts, etc.
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    body {
      background: #12121f;
      color: #ddd;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #news-container {
      padding: 20px 24px;
      flex: 1;
      overflow-y: auto;
    }
    h1 {
      font-size: 24px;
      color: #b3b3ff;
      margin-bottom: 20px;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }

    /* ---- News list ---- */
    .news-item {
      background: #1a1a30;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
      cursor: pointer;
      border-left: 4px solid #4a4a8a;
      transition: background 0.2s, border-color 0.2s;
    }
    .news-item:hover {
      background: #222244;
      border-color: #7f7fcf;
    }
    .news-item h3 {
      font-size: 18px;
      color: #e0e0ff;
      margin-bottom: 4px;
    }
    .news-item .date {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }
    .news-item .summary {
      font-size: 14px;
      color: #aaa;
    }
    .news-item .full-content {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
      font-size: 14px;
      line-height: 1.7;
      color: #ccc;
    }
    .news-item.expanded .full-content {
      display: block;
    }
    .news-item.expanded {
      border-left-color: #b3b3ff;
      background: #1e1e38;
    }
  </style>
</head>
<body>
<div id="news-container">
  <h1>👁 Latest News</h1>
  <div id="news-list"></div>
</div>

<script>
  const newsData = [
    {
      title: "Hot fixes for website #2",
      date: "sept 10, 2026",
      summary: "I fix the [] icon",
      full: "the [] icon is now fixed and it should work now like it should. the icon was making multiple taps overlap and never close then clicking on it again. but now its fixed.",
    }, 
  {
      title: "Hot fixes for website",
      date: "sept 9, 2026",
      summary: "I fix the phone and clicking problems",
      full: "So I had an idea that I should make the website duoble click to open the apps and others. but it end up being confusing for some people so I change it back to 1 click to open the apps. I also fix when open website from phone it don't hopefully zoom in the website. that it thank you all! <3",
    }, 
  {
      title: "SharkiyLand 2.0 webiste is now done!",
      date: "sept 8, 2026",
      summary: "The wesbite is now DONE!",
      full: "It took me like whole week working on this website and now it's finally done. I hope you enjoy it and I hope you like it. I will be updating this website in the future so stay tuned for more updates.",
    },
  ];

  const newsList = document.getElementById('news-list');

  // Render news items
  newsData.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'news-item';
    div.innerHTML = `
      <h3>${item.title}</h3>
      <div class="date">${item.date}</div>
      <div class="summary">${item.summary}</div>
      <div class="full-content">${item.full}</div>
    `;
    // Toggle expanded on click
    div.addEventListener('click', () => {
      div.classList.toggle('expanded');
    });
    newsList.appendChild(div);
  });
</script>
</body>
</html>
