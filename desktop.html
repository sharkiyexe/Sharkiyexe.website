<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My PC Desktop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============================================================
     DESKTOP AREA
     –––––––––––––––––––––––––––––––––––––––––––––––––––––––––––– -->
<div id="desktop">

  <!-- ===== DESKTOP ICONS ===== -->
  <div class="desktop-icon" data-app="pc">
    <img class="icon-img" src="icons/PC.png" alt="This is your PC" />
    <span class="icon-label">This is your PC</span>
  </div>

  <div class="desktop-icon" data-app="sharkiyland">
    <img class="icon-img" src="icons/Sharkiy Land.png" alt="SharkiyLand" />
    <span class="icon-label">SharkiyLand</span>
  </div>

  <div class="desktop-icon" data-app="news">
    <img class="icon-img" src="icons/News.png" alt="News" />
    <span class="icon-label">News</span>
  </div>

  <div class="desktop-icon" data-app="about">
    <img class="icon-img" src="icons/About.png" alt="About Me" />
    <span class="icon-label">About Me</span>
  </div>

  <div class="desktop-icon" data-app="portfolio">
    <img class="icon-img" src="icons/My Work & Reviews.png" alt="Portfolio" />
    <span class="icon-label">My Work & Reviews</span>
  </div>

  <!-- ============================================================
       WINDOWS XP TASKBAR
       –––––––––––––––––––––––––––––––––––––––––––––––––––––––––––– 
       To change the taskbar background → edit --taskbar-bg in styles.css
       To change the Start icon → change the src of #start-icon-img
  ============================================================ -->
  <div id="taskbar">

    <!-- Start button (with image icon) -->
    <div id="start-btn" title="Start">
      <!-- ============================================================
           START ICON IMAGE – replace src with your own picture
      ============================================================ -->
      <img id="start-icon-img" src="icons/xp-start.png" alt="Start"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
      <span id="start-text">🪟 start</span>
    </div>

    <!-- Quick Launch (optional) -->
    <div id="quick-launch">
      <div class="quick-icon" title="Show Desktop">
        <img src="icons/show-desktop.png" alt=""
             onerror="this.parentElement.style.display='none'" />
      </div>
    </div>

    <!-- Open windows appear here -->
    <div id="taskbar-windows"></div>

    <!-- System Tray (volume + clock) -->
    <div id="system-tray">

      <!-- Volume icon -->
      <div id="volume-icon" title="Volume">
        <span id="volume-symbol">🔊</span>
      </div>

      <!-- Clock -->
      <div id="clock">00:00</div>

    </div>
  </div>
</div>

<!-- ============================================================
     VOLUME POPUP (appears above taskbar when clicking the icon)
============================================================ -->
<div id="volume-popup">
  <div id="volume-label">Volume</div>
  <input type="range" id="volume-slider" min="0" max="100" value="100" />
  <div id="volume-percent">100%</div>
</div>

<!-- ============================================================
     STARTUP SOUND – plays only once when desktop loads
============================================================ -->
<audio id="startup-sound" preload="auto">
  <source src="sounds/startup.mp3" type="audio/mpeg" />
</audio>

<!-- ============================================================
     MAIN JAVASCRIPT
============================================================ -->
<script>
  /* ============================================================
     APP CONFIG
  ============================================================ */
  const APP_CONFIG = {
    pc: {
      id: 'pc',
      title: 'This is your PC',
      url: 'pc.html',
      icon: 'icons/PC.png'
    },
    sharkiyland: {
      id: 'sharkiyland',
      title: 'SharkiyLand',
      url: 'sharkiyland.html',
      icon: 'icons/Sharkiy Land.png'
    },
    news: {
      id: 'news',
      title: 'News',
      url: 'news.html',
      icon: 'icons/News.png'
    },
    about: {
      id: 'about',
      title: 'About Me',
      url: 'about.html',
      icon: 'icons/About.png'
    },
    portfolio: {
      id: 'portfolio',
      title: 'My Work & Reviews',
      url: 'portfolio.html',
      icon: 'icons/My Work & Reviews.png'
    }
  };

  const openWindows = {};
  let windowZIndex = 100;
  let nextWindowId = 0;

  const desktop = document.getElementById('desktop');
  const taskbarWindows = document.getElementById('taskbar-windows');
  const clockEl = document.getElementById('clock');

  /* ─── Clock ─── */
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    clockEl.textContent = h + ':' + m;
  }
  updateClock();
  setInterval(updateClock, 10000);

  /* ============================================================
     STARTUP SOUND – plays only once
  ============================================================ */
  (function() {
    const hasPlayed = localStorage.getItem('desktop_startup_played');
    if (!hasPlayed) {
      const audio = document.getElementById('startup-sound');
      if (audio) {
        audio.volume = 0.6;
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            const playOnInteraction = () => {
              audio.play().catch(() => {});
              document.removeEventListener('click', playOnInteraction);
              document.removeEventListener('touchstart', playOnInteraction);
            };
            document.addEventListener('click', playOnInteraction);
            document.addEventListener('touchstart', playOnInteraction);
          });
        }
        localStorage.setItem('desktop_startup_played', 'true');
      }
    }
  })();

  /* ============================================================
     DESKTOP ICONS – single click to open (with drag detection)
  ============================================================ */
  document.querySelectorAll('.desktop-icon').forEach(iconEl => {
    let isDragging = false;

    iconEl.addEventListener('mousedown', () => { isDragging = false; });
    iconEl.addEventListener('mousemove', () => { isDragging = true; });
    iconEl.addEventListener('mouseup', () => {
      if (!isDragging) {
        const appId = iconEl.dataset.app;
        if (appId && APP_CONFIG[appId]) openApp(appId);
      }
      isDragging = false;
    });

    // Touch support
    iconEl.addEventListener('touchstart', () => { isDragging = false; });
    iconEl.addEventListener('touchmove', () => { isDragging = true; });
    iconEl.addEventListener('touchend', () => {
      if (!isDragging) {
        const appId = iconEl.dataset.app;
        if (appId && APP_CONFIG[appId]) openApp(appId);
      }
      isDragging = false;
    });
  });

  /* ============================================================
     OPEN AN APP
  ============================================================ */
  function openApp(appId) {
    if (openWindows[appId]) {
      bringToFront(openWindows[appId]);
      return;
    }
    const config = APP_CONFIG[appId];
    if (!config) return;
    const win = createWindow(config);
    openWindows[appId] = win;
    document.body.appendChild(win.element);
    const iframe = win.element.querySelector('.window-content iframe');
    iframe.src = config.url;
    addTaskbarItem(appId, config.title);
    bringToFront(win);
  }

  /* ============================================================
     CREATE WINDOW
  ============================================================ */
  function createWindow(config) {
    const winId = 'win-' + (++nextWindowId);
    const el = document.createElement('div');
    el.className = 'window';
    el.dataset.winId = winId;
    el.style.zIndex = ++windowZIndex;

    el.innerHTML = `
      <div class="window-titlebar">
        <span class="window-title">${config.title}</span>
        <div class="window-controls">
          <button class="win-btn win-min" title="Minimize">─</button>
          <button class="win-btn win-max" title="Maximize">☐</button>
          <button class="win-btn win-close" title="Close">✕</button>
        </div>
      </div>
      <div class="window-content">
        <iframe src="about:blank" frameborder="0"></iframe>
      </div>
      <div class="window-resize-handle"></div>
    `;

    const state = {
      element: el,
      id: winId,
      appId: config.id,
      title: config.title,
      isMaximized: false,
      prevRect: null,
      iframe: el.querySelector('.window-content iframe'),
      titlebar: el.querySelector('.window-titlebar'),
      closeBtn: el.querySelector('.win-close'),
      minBtn: el.querySelector('.win-min'),
      maxBtn: el.querySelector('.win-max'),
      resizeHandle: el.querySelector('.window-resize-handle'),
    };

    state.closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeWindow(state.appId);
    });
    state.minBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      minimizeWindow(state.appId);
    });
    state.maxBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMaximize(state);
    });
    state.titlebar.addEventListener('dblclick', () => toggleMaximize(state));

    // Drag
    let dragData = null;
    state.titlebar.addEventListener('mousedown', (e) => {
      if (state.isMaximized) return;
      if (e.target.closest('.window-controls')) return;
      dragData = {
        win: state,
        startX: e.clientX,
        startY: e.clientY,
        origLeft: el.offsetLeft,
        origTop: el.offsetTop,
      };
      bringToFront(state);
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragData) return;
      const dx = e.clientX - dragData.startX;
      const dy = e.clientY - dragData.startY;
      dragData.win.element.style.left = Math.max(0, dragData.origLeft + dx) + 'px';
      dragData.win.element.style.top = Math.max(0, dragData.origTop + dy) + 'px';
    });
    document.addEventListener('mouseup', () => { dragData = null; });

    // Resize
    let resizeData = null;
    state.resizeHandle.addEventListener('mousedown', (e) => {
      if (state.isMaximized) return;
      resizeData = {
        win: state,
        startX: e.clientX,
        startY: e.clientY,
        startW: el.offsetWidth,
        startH: el.offsetHeight,
      };
      e.preventDefault();
      e.stopPropagation();
    });
    document.addEventListener('mousemove', (e) => {
      if (!resizeData) return;
      const dx = e.clientX - resizeData.startX;
      const dy = e.clientY - resizeData.startY;
      resizeData.win.element.style.width = Math.max(300, resizeData.startW + dx) + 'px';
      resizeData.win.element.style.height = Math.max(200, resizeData.startH + dy) + 'px';
    });
    document.addEventListener('mouseup', () => { resizeData = null; });

    // Initial size & position
    const w = Math.min(750, window.innerWidth - 80);
    const h = Math.min(520, window.innerHeight - 120);
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.left = ((window.innerWidth - w) / 2) + 'px';
    el.style.top = ((window.innerHeight - h) / 2 - 20) + 'px';

    return state;
  }

  /* ============================================================
     UTILITY FUNCTIONS
  ============================================================ */
  function bringToFront(winState) {
    winState.element.style.zIndex = ++windowZIndex;
    winState.element.classList.remove('minimized');
    const btn = document.querySelector(`.taskbar-btn[data-app="${winState.appId}"]`);
    if (btn) btn.classList.remove('minimized');
  }

  function closeWindow(appId) {
    const win = openWindows[appId];
    if (!win) return;
    win.element.remove();
    delete openWindows[appId];
    const btn = document.querySelector(`.taskbar-btn[data-app="${appId}"]`);
    if (btn) btn.remove();
  }

  function minimizeWindow(appId) {
    const win = openWindows[appId];
    if (!win) return;
    win.element.classList.add('minimized');
    const btn = document.querySelector(`.taskbar-btn[data-app="${appId}"]`);
    if (btn) btn.classList.add('minimized');
  }

  function toggleMaximize(winState) {
    const el = winState.element;
    if (winState.isMaximized) {
      if (winState.prevRect) {
        el.style.left = winState.prevRect.left + 'px';
        el.style.top = winState.prevRect.top + 'px';
        el.style.width = winState.prevRect.width + 'px';
        el.style.height = winState.prevRect.height + 'px';
      }
      el.style.borderRadius = '8px';
      winState.isMaximized = false;
      winState.maxBtn.textContent = '☐';
    } else {
      winState.prevRect = {
        left: el.offsetLeft,
        top: el.offsetTop,
        width: el.offsetWidth,
        height: el.offsetHeight,
      };
      el.style.left = '0px';
      el.style.top = '0px';
      el.style.width = '100%';
      el.style.height = '100%';
      el.style.borderRadius = '0';
      winState.isMaximized = true;
      winState.maxBtn.textContent = '⧉';
    }
  }

  function addTaskbarItem(appId, title) {
    const btn = document.createElement('button');
    btn.className = 'taskbar-btn';
    btn.dataset.app = appId;
    btn.textContent = title;
    btn.addEventListener('click', () => {
      const win = openWindows[appId];
      if (!win) return;
      if (win.element.classList.contains('minimized')) {
        win.element.classList.remove('minimized');
        btn.classList.remove('minimized');
        bringToFront(win);
      } else {
        bringToFront(win);
      }
    });
    taskbarWindows.appendChild(btn);
  }

  /* ============================================================
     START MENU (toggle open/close with same button)
  ============================================================ */
  let startMenuOpen = false;
  let startMenuElement = null;

  function createStartMenu() {
    const menu = document.createElement('div');
    menu.id = 'start-menu';
    menu.style.cssText = `
      position: fixed;
      bottom: 50px;
      left: 4px;
      background: linear-gradient(to bottom, #2e5fc7, #1941a5);
      color: #fff;
      border: 2px solid #0a246a;
      border-radius: 8px 8px 0 0;
      padding: 6px 0;
      min-width: 220px;
      z-index: 9999;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      font-family: 'Tahoma', sans-serif;
      overflow: hidden;
    `;

    const header = document.createElement('div');
    header.style.cssText = `
      background: linear-gradient(to bottom, #3f8cf3, #245edb);
      padding: 8px 14px;
      font-weight: bold;
      font-size: 13px;
      border-bottom: 1px solid #0a246a;
      margin-top: -6px;
      margin-bottom: 6px;
      text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
    `;
    header.textContent = '🖥️ My PC';
    menu.appendChild(header);

    for (const [id, cfg] of Object.entries(APP_CONFIG)) {
      const item = document.createElement('div');
      item.style.cssText =
        'padding: 8px 18px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #fff; transition: background 0.15s;';
      item.innerHTML = `<span style="font-size:16px;">📁</span> ${cfg.title}`;
      item.addEventListener('mouseenter', () => item.style.background = 'rgba(255,255,255,0.18)');
      item.addEventListener('mouseleave', () => item.style.background = 'transparent');
      item.addEventListener('click', () => {
        closeStartMenu();
        openApp(id);
      });
      menu.appendChild(item);
    }
    return menu;
  }

  function openStartMenu() {
    if (startMenuOpen) return;
    startMenuElement = createStartMenu();
    document.body.appendChild(startMenuElement);
    startMenuOpen = true;
  }
  function closeStartMenu() {
    if (!startMenuOpen || !startMenuElement) return;
    startMenuElement.remove();
    startMenuElement = null;
    startMenuOpen = false;
  }
  function toggleStartMenu() {
    if (startMenuOpen) closeStartMenu();
    else openStartMenu();
  }

  document.getElementById('start-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleStartMenu();
  });

  document.addEventListener('click', (e) => {
    if (startMenuOpen && startMenuElement) {
      if (!startMenuElement.contains(e.target) && !e.target.closest('#start-btn')) {
        closeStartMenu();
      }
    }
  });

  /* ============================================================
     MASTER VOLUME CONTROL
     – saves to localStorage
     – broadcasts to iframes for future apps
  ============================================================ */
  const volumeSlider = document.getElementById('volume-slider');
  const volumePercent = document.getElementById('volume-percent');
  const volumeIcon = document.getElementById('volume-icon');
  const volumeSymbol = document.getElementById('volume-symbol');
  const volumePopup = document.getElementById('volume-popup');

  let masterVolume = parseInt(localStorage.getItem('masterVolume') || '100', 10);
  volumeSlider.value = masterVolume;
  updateVolumeUI(masterVolume);

  volumeIcon.addEventListener('click', (e) => {
    e.stopPropagation();
    volumePopup.classList.toggle('show');
  });

  document.addEventListener('click', (e) => {
    if (!volumePopup.contains(e.target) && !volumeIcon.contains(e.target)) {
      volumePopup.classList.remove('show');
    }
  });

  volumeSlider.addEventListener('input', () => {
    masterVolume = parseInt(volumeSlider.value, 10);
    updateVolumeUI(masterVolume);
    localStorage.setItem('masterVolume', masterVolume);
    broadcastVolume(masterVolume);
  });

  function updateVolumeUI(vol) {
    volumePercent.textContent = vol + '%';
    if (vol === 0) volumeSymbol.textContent = '🔇';
    else if (vol < 40) volumeSymbol.textContent = '🔈';
    else if (vol < 80) volumeSymbol.textContent = '🔉';
    else volumeSymbol.textContent = '🔊';
  }

  function broadcastVolume(vol) {
    document.querySelectorAll('.window-content iframe').forEach(iframe => {
      try {
        iframe.contentWindow.postMessage({ type: 'masterVolume', value: vol }, '*');
      } catch (err) {}
    });
  }

  // Send volume to new iframes when they load
  const observer = new MutationObserver((mutations) => {
    mutations.forEach(m => {
      m.addedNodes.forEach(node => {
        if (node.nodeName === 'IFRAME') {
          node.addEventListener('load', () => {
            try {
              node.contentWindow.postMessage({ type: 'masterVolume', value: masterVolume }, '*');
            } catch (err) {}
          });
        }
      });
    });
  });
  observer.observe(document.body, { childList: true, subtree: true });

  /* ============================================================
     AUTO-OPEN VIA HASH (e.g. #pc)
  ============================================================ */
  if (window.location.hash) {
    const appId = window.location.hash.replace('#', '');
    if (APP_CONFIG[appId]) setTimeout(() => openApp(appId), 300);
  }
</script>

</body>
</html>
